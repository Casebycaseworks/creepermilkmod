import groovy.json.JsonSlurper
import java.util.zip.ZipFile
import net.fabricmc.loom.task.RemapJarTask

plugins {
	id 'fabric-loom' version '1.10.5'
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.1.20"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

sourceSets {
	gametest {
		java.srcDir "src/gametest/java"
		resources.srcDir "src/gametest/resources"
	}
	clientE2e {
		java.srcDir "src/clientE2e/java"
		resources.srcDir "src/clientE2e/resources"
	}
}

loom {
	splitEnvironmentSourceSets()
	createRemapConfigurations(sourceSets.clientE2e)

	mods {
		"creepermilk" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"creepermilk-gametest" {
			sourceSet sourceSets.gametest
		}
		"creepermilk-client-e2e" {
			sourceSet sourceSets.clientE2e
		}
	}

}

sourceSets.gametest {
	compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	runtimeClasspath += output + compileClasspath
}

sourceSets.clientE2e {
	compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
	runtimeClasspath += output + compileClasspath
}

tasks.named("processGametestResources") { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
tasks.named("processClientE2eResources") { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
tasks.register("gametestJar", Jar) {
	group = "verification"
	archiveBaseName = "creepermilk-gametest"
	from sourceSets.gametest.output
	dependsOn tasks.named("gametestClasses")
}
tasks.register("clientE2eJar", Jar) {
	group = "verification"
	description = "Builds the separate installed-client E2E harness."
	archiveBaseName = "creepermilk-client-e2e"
	from sourceSets.clientE2e.output
	dependsOn tasks.named("clientE2eClasses")
}
tasks.register("remapClientE2eJar", RemapJarTask) {
	group = "verification"
	description = "Remaps the separate installed-client E2E harness."
	dependsOn tasks.named("clientE2eJar")
	inputFile = tasks.named("clientE2eJar").flatMap { it.archiveFile }
	archiveBaseName = "creepermilk-client-e2e"
	archiveVersion = project.version
	archiveClassifier = "installed"
	addNestedDependencies = false
	includesClientOnlyClasses = true
	sourceNamespace = "named"
	targetNamespace = "intermediary"
}
tasks.register("printGameTestClasspath") { doLast { println sourceSets.gametest.compileClasspath.asPath } }
configurations {
	gametestImplementation.extendsFrom(modImplementation)
	gametestRuntimeOnly.extendsFrom(modRuntimeOnly)
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	gametestImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:1.3.6+85d85a934f"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 17
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Ensure Kotlin is compiled before Java so Java code can access Kotlin classes
compileJava.dependsOn(compileKotlin)

// Validate the finished remapped jar, catching stale identity and test/source leakage.
tasks.register("validateReleaseJar") {
	dependsOn tasks.named("remapJar")
	doLast {
		def release = tasks.named("remapJar").get().archiveFile.get().asFile
		def expected = "creepermilk-${project.minecraft_version}-${project.mod_version}.jar"
		if (release.name != expected) throw new GradleException("Unexpected release name: ${release.name}; expected ${expected}")
		def zip = new java.util.zip.ZipFile(release)
		try {
			def mod = zip.getEntry("fabric.mod.json")
			if (mod == null) throw new GradleException("fabric.mod.json missing from release")
			def metadata = new JsonSlurper().parse(zip.getInputStream(mod))
			def deps = metadata.depends as Map
			if (metadata.id != "creepermilk" || metadata.version != project.mod_version.toString()) throw new GradleException("incorrect mod identity")
			if (deps.minecraft != "~1.20.4" || deps.fabricloader != ">=0.16.14" || deps.java != ">=17" || deps["fabric-api"] != ">=0.97.3+1.20.4" || deps["fabric-language-kotlin"] != ">=1.13.2+kotlin.2.1.20") throw new GradleException("incorrect dependency metadata: ${deps}")
			def mainValues = metadata.entrypoints.main.collect { it instanceof Map ? it.value : it }.flatten()
			if (!(mainValues.contains("milk.creeper.Creepermilk") && mainValues.contains("milk.creeper.CreepermilkItems"))) throw new GradleException("missing main entrypoints")
			if (metadata.entrypoints.values().flatten().any { it instanceof Map && it.value?.toString()?.contains("gametest") }) throw new GradleException("test entrypoint leaked into release")
			[
				"assets/creepermilk/lang/en_us.json",
				"assets/creepermilk/models/item/creeper_milk_bucket.json",
				"data/creepermilk/advancements/milk_creeper.json",
				"data/creepermilk/recipes/cake_mmm.json",
				"data/creepermilk/recipes/cake_with_creeper_milk.json",
				"data/creepermilk/recipes/creeper_milk_to_milk.json",
				"data/creepermilk/tags/items/milks.json",
				"data/c/tags/items/milk.json",
				"creepermilk.mixins.json",
				"creepermilk.client.mixins.json"
			].each { required ->
				if (zip.getEntry(required) == null) throw new GradleException("missing required release resource: ${required}")
			}
			zip.entries().each { e ->
				if (e.name.startsWith("src/") || e.name.startsWith("net/fabricmc/") || e.name.toLowerCase().contains("gametest") || e.name.toLowerCase().contains("cliente2e")) throw new GradleException("Unexpected source/test content: ${e.name}")
				if (e.name.endsWith(".class")) {
					def header = zip.getInputStream(e).readNBytes(8)
					def major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
					if (major != 61) throw new GradleException("non-Java-17 class ${e.name}: major ${major}")
				}
			}
		} finally { zip.close() }
	}
}
