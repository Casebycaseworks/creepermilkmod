name: build-1.20.4

on: [pull_request, push]

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Validate tracked automation
        run: |
          chmod +x ./gradlew .github/scripts/*.sh
          bash -n .github/scripts/run-gametest-1.20.4.sh
          bash -n .github/scripts/smoke-test-server-1.20.4.sh
          bash -n .github/scripts/run-visible-client-e2e-1.20.4.sh
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/build.yml")'
          git diff --check
          test "$(find .github/scripts -maxdepth 1 -type f -name '*.sh' | wc -l | tr -d ' ')" = 3
          ! rg -n '1\.20\.[256]|1\.21' .github
      - name: Clean build and semantic release validation
        run: ./gradlew --no-daemon --console=plain clean build gametestJar remapClientE2eJar validateReleaseJar
      - name: Execute exact four-case GameTests
        env:
          JAVA17_HOME: ${{ env.JAVA_HOME }}
        run: .github/scripts/run-gametest-1.20.4.sh build/reports/gametest/TEST-creepermilk-1.20.4.xml build/reports/gametest/runtime-1.20.4.log
      - name: Smoke-test packaged release server
        env:
          JAVA17_BIN: ${{ env.JAVA_HOME }}/bin/java
        run: .github/scripts/smoke-test-server-1.20.4.sh build/libs/creepermilk-1.20.4-1.0.0.jar build/reports/server-smoke/server-latest.log
      - name: Upload exact release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creeper-milk-1.20.4-release
          if-no-files-found: ignore
          path: build/libs/creepermilk-1.20.4-1.0.0.jar
      - name: Upload runtime test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creeper-milk-1.20.4-runtime-evidence
          if-no-files-found: ignore
          path: |
            build/reports/gametest/TEST-creepermilk-1.20.4.xml
            build/reports/gametest/runtime-1.20.4.log
            build/reports/server-smoke/server-latest.log
